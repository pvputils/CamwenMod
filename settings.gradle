		}
		mavenCentral()
		gradlePluginPortal()
	}
    plugins {
        id 'org.jetbrains.kotlin.jvm' version '2.4.20' //codex (id 'org.jetbrains.kotlin.jvm' version '2.4.10')
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}