allprojects {
    afterEvaluate {
        fabricApi {
            configureTests {
                createSourceSet = true
                modId = 'camwen-approach-tests'
                enableGameTests = false
            }
        }
        tasks.named('processGametestResources') {
            rename('ApproachMouseGameTestTodoAi.json', 'fabric.mod.json')
        }
        tasks.named('runClientGameTest') {
            timeout = java.time.Duration.ofMinutes(5)
        }
        // codex start
        loom.runs.named('clientGameTest') { environmentVariable('ALSOFT_DRIVERS', 'null') }
        //codex end
    }
}
